name: gafl
channels:
  - pytorch
  - nvidia
  - pyg
  - conda-forge
dependencies:
  - python=3.10
  - pip
  - setuptools<81             # lightning 1.9.5 still uses pkg_resources
  - pytorch=2.1.2=py3.10_cuda12.1_cudnn8.9.2_0
  - pytorch-cuda=12.1
  - pytorch-mutex=1.0=cuda
  - pytorch-scatter=2.1.2=py310_torch_2.1.0_cu121
  - numpy=1.26.*
  - pandas
  - scipy
  - scikit-learn
  - tqdm
  - biopython
  - biotite
  - mdtraj
  - tmtools
  - openmm
  - pdbfixer
  - dm-tree
  - pip:
      - absl-py==2.1.0
      - hydra-core==1.3.2
      - omegaconf==2.3.0
      - ml-collections==0.1.1
      - GPUtil==1.4.0
      - wandb==0.16.4
      - einops==0.7.0
      - opt-einsum==3.4.0
      - pytorch-lightning==1.9.5
      - torchmetrics==1.1.2
      - matplotlib==3.7.3
      - seaborn==0.13.2
      - MDAnalysis==2.7.0
      - hjson
      - ipython
      # optional analysis / openfold dependencies (kept to avoid future dep
      # conflicts even though the basic inference/train commands don't need them)
      - fair-esm==2.0.0           # used by gafl/analysis/sc_dataset.py
      - deepspeed==0.14.5         # required by openfold/{model,utils}; >=0.18 needs torch>=2.4
      - git+https://github.com/NVIDIA/dllogger.git  # imported by openfold/utils/logger.py
      # gafl itself (run from repo root):
      #   pip install -e .
      # gatr (patched fork of qualcomm-ai-research/geometric-algebra-transformer):
      #   bash install_gatr.sh
